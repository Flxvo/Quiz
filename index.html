<html> 
    <header>
        <title>Proof das man auch ohne KI kann</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </header>

    <body class="container d-flex justify-content-center align-items-center bg-dark">
        <div id="Quiz-container" class="card">
            <div class="card-header">
                  <h1 id="question"></h1>

            </div>
            <div class="card-body">
                <div id="answers"></div>

            </div>
            <div class="card-footer">
                <button id="next-button" class="btn btn-primary" onclick="nextQuestion()"> Naechste Frage</button>

            </div>
          
        </div>

        <div id="result" hidden="true" class="card">
            <div class="card-header">
                <h1>Quiz beendet!</h1>

            </div>
            <div class="card-body">
                   <p>Deine Punktzahl: <span id="score"></span></p>

            </div>
            <div class="card-footer">

            </div>
         
            
        </div>
    </body>

   <script src="Quiz.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
